# E2E test suite verification for amplifier-module-hooks-logging.
#
# Builds a clean Ubuntu 24.04 environment, installs uv + Rust toolchain,
# clones amplifier-core (sibling dependency, maturin/pyo3) and this module
# from a Gitea mirror, then runs `uv run pytest tests/ -v` -- the canonical
# verification step after implementation.
#
# Why Gitea: the module's pyproject.toml uses
#   [tool.uv.sources] amplifier-core = { path = "../amplifier-core" }
# so testing requires the local sibling state of amplifier-core. To verify
# unpushed branches in isolation, we mirror both repos to Gitea before
# launch and clone them into the container at the matching relative
# layout (`/root/work/amplifier-core`, `/root/work/amplifier-module-hooks-logging`).
#
# Prerequisites for team reuse:
#   1. amplifier-core checked out as a sibling of this repo.
#   2. amplifier-gitea + Docker available on the host.
#   3. Mirror both local checkouts into a Gitea environment as
#      `admin/amplifier-core` and `admin/amplifier-module-hooks-logging`.
#   4. Pass GITEA_URL / GITEA_TOKEN via --var when launching:
#
#        amplifier-digital-twin launch \
#          .amplifier/digital-twin-universe/profiles/test-suite.yaml \
#          --var GITEA_URL=http://localhost:<port> \
#          --var GITEA_TOKEN=<token>
#
# After launch, run the verification:
#   amplifier-digital-twin exec <id> -- bash -lc \
#     'cd /root/work/amplifier-module-hooks-logging && \
#      PATH=/root/.local/bin:/root/.cargo/bin:$PATH uv run pytest tests/ -v'
name: test-suite
description: >
  Isolated E2E verification environment for amplifier-module-hooks-logging.
  Provisions Rust + uv, clones amplifier-core and the module from Gitea,
  runs `uv sync --group dev` so amplifier-core builds via maturin from the
  local relative path. Tests are executed via `exec` after launch.

base:
  image: ubuntu:24.04

# crates.io and astral.sh are reached during provisioning.
passthrough:
  allow_external: true

provision:
  setup_cmds:
    # System deps for Rust + Python C extensions
    - apt-get update && apt-get install -y --no-install-recommends
        git curl ca-certificates build-essential pkg-config libssl-dev
        python3 python3-dev

    # uv (Python package manager / project runner)
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - /root/.local/bin/uv --version

    # Rust toolchain (amplifier-core is built via maturin/pyo3)
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
        sh -s -- -y --default-toolchain stable --profile minimal
    - /root/.cargo/bin/rustc --version
    - /root/.cargo/bin/cargo --version

    # Clone both repos from Gitea using authenticated HTTP.
    # Layout matches `path = "../amplifier-core"` in the module's pyproject.toml.
    # Credentials are injected via a one-shot git config so the URL stays clean.
    - mkdir -p /root/work
    - |
      git -c "http.extraHeader=Authorization: token ${GITEA_TOKEN}" \
        clone "${GITEA_URL}/admin/amplifier-core.git" \
        /root/work/amplifier-core
    - |
      git -c "http.extraHeader=Authorization: token ${GITEA_TOKEN}" \
        clone "${GITEA_URL}/admin/amplifier-module-hooks-logging.git" \
        /root/work/amplifier-module-hooks-logging

    # Provenance: print the SHAs of what we're about to test.
    - cd /root/work/amplifier-core && git rev-parse HEAD
    - cd /root/work/amplifier-module-hooks-logging && git rev-parse HEAD

    # Sync the dev group. This builds amplifier-core's wheel via maturin
    # from the sibling path, then installs pytest / pytest-asyncio.
    - |
      export PATH="/root/.local/bin:/root/.cargo/bin:$PATH"
      cd /root/work/amplifier-module-hooks-logging
      uv sync --group dev

    # Smoke-check the venv -- amplifier-core importable, pytest discoverable.
    - |
      export PATH="/root/.local/bin:/root/.cargo/bin:$PATH"
      cd /root/work/amplifier-module-hooks-logging
      uv run python -c "import amplifier_core; print('amplifier_core OK')"
      uv run pytest tests/ --collect-only -q | tail -20

# Update path: refresh both repos and re-sync if the operator re-mirrors
# Gitea between iterations. Faster than a full destroy + relaunch.
update:
  cmds:
    - cd /root/work/amplifier-core && git fetch origin && git reset --hard origin/main
    - cd /root/work/amplifier-module-hooks-logging && git fetch origin && git reset --hard origin/main
    - |
      export PATH="/root/.local/bin:/root/.cargo/bin:$PATH"
      cd /root/work/amplifier-module-hooks-logging
      uv sync --group dev

readiness:
  - name: uv-installed
    command: "/root/.local/bin/uv --version"
  - name: dev-deps-installed
    command: "cd /root/work/amplifier-module-hooks-logging && PATH=/root/.local/bin:/root/.cargo/bin:$PATH /root/.local/bin/uv run python -c 'import amplifier_core, pytest'"
